<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>NVIDIA AI Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 720px;
    margin: 40px auto;
    padding: 0 16px;
  }
  h1 { font-size: 1.4rem; }
  #chat {
    border: 1px solid #ccc;
    border-radius: 8px;
    min-height: 300px;
    max-height: 60vh;
    overflow-y: auto;
    padding: 12px;
    margin-bottom: 12px;
  }
  .msg { margin: 8px 0; padding: 8px 12px; border-radius: 8px; line-height: 1.4; }
  .user { background: #dbeafe; text-align: right; }
  .assistant { background: #f1f5f9; }
  .error { background: #fee2e2; color: #991b1b; }
  form { display: flex; gap: 8px; }
  textarea { flex: 1; resize: vertical; min-height: 48px; font-family: inherit; padding: 8px; }
  button { padding: 8px 16px; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
  #model-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  #model-bar label { font-size: 0.9rem; }
  #model { font-family: inherit; padding: 6px 8px; max-width: 360px; }
  #refresh-models { padding: 6px 10px; font-size: 0.85rem; }
</style>
</head>
<body>
  <h1>🤖 NVIDIA AI Chat</h1>
  <div id="model-bar">
    <label for="model">Modell:</label>
    <select id="model"></select>
    <button id="refresh-models" type="button" title="Modellliste aktualisieren">↻</button>
    <span id="model-count" style="font-size:0.8rem;color:#888;"></span>
  </div>
  <div id="chat"></div>
  <form id="form">
    <textarea id="question" placeholder="Deine Frage..." required></textarea>
    <button id="send" type="submit">Senden</button>
  </form>

<script>
const chatEl = document.getElementById('chat');
const form = document.getElementById('form');
const questionEl = document.getElementById('question');
const sendBtn = document.getElementById('send');
const modelSelect = document.getElementById('model');
const refreshBtn = document.getElementById('refresh-models');
const modelCount = document.getElementById('model-count');
let history = [];
let selectedModel = null;

async function loadModels() {
  modelCount.textContent = 'Lade Modelle...';
  try {
    // Fetch models and config in parallel
    const [modelsRes, configRes] = await Promise.all([
      fetch('/api/models'),
      fetch('/api/config')
    ]);
    const data = await modelsRes.json();
    if (!modelsRes.ok) throw new Error(data.detail || 'Fehler beim Laden');
    const config = await configRes.json();
    const defaultModel = config.default_model;

    // Group by provider
    const providers = {};
    data.models.forEach(m => {
      if (!providers[m.provider]) providers[m.provider] = [];
      providers[m.provider].push(m.id);
    });

    modelSelect.innerHTML = '';
    for (const provider of Object.keys(providers).sort()) {
      const optgroup = document.createElement('optgroup');
      optgroup.label = provider;
      providers[provider].sort().forEach(id => {
        const opt = document.createElement('option');
        opt.value = id;
        opt.textContent = id;
        optgroup.appendChild(opt);
      });
      modelSelect.appendChild(optgroup);
    }

    // Select default model from config (or restore previous selection)
    const modelToSelect = selectedModel || defaultModel;
    if (modelToSelect && [...modelSelect.options].some(o => o.value === modelToSelect)) {
      modelSelect.value = modelToSelect;
      selectedModel = modelToSelect;
    }
    modelCount.textContent = data.total + ' Modelle';
  } catch (err) {
    modelCount.textContent = '';
    const opt = document.createElement('option');
    opt.textContent = 'Fehler: ' + err.message;
    opt.disabled = true;
    modelSelect.innerHTML = '';
    modelSelect.appendChild(opt);
  }
}

modelSelect.addEventListener('change', () => {
  selectedModel = modelSelect.value;
});

refreshBtn.addEventListener('click', loadModels);

// Load models on startup
loadModels();

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const question = questionEl.value.trim();
  if (!question) return;

  addMessage('user', question);
  history.push({ role: 'user', content: question });
  questionEl.value = '';
  sendBtn.disabled = true;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, model: selectedModel, history: history.slice(0, -1) })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Unbekannter Fehler');
    addMessage('assistant', data.answer);
    history.push({ role: 'assistant', content: data.answer });
  } catch (err) {
    addMessage('error', 'Fehler: ' + err.message);
  } finally {
    sendBtn.disabled = false;
  }
});
</script>
</body>
</html>
