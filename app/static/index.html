<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>NVIDIA AI Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 720px;
    margin: 40px auto;
    padding: 0 16px;
  }
  h1 { font-size: 1.4rem; }
  #chat {
    border: 1px solid #ccc;
    border-radius: 8px;
    min-height: 300px;
    max-height: 60vh;
    overflow-y: auto;
    padding: 12px;
    margin-bottom: 12px;
  }
  .msg { margin: 8px 0; padding: 8px 12px; border-radius: 8px; line-height: 1.4; }
  .user { background: #dbeafe; text-align: right; }
  .assistant { background: #f1f5f9; }
  .error { background: #fee2e2; color: #991b1b; }
  form { display: flex; gap: 8px; }
  textarea { flex: 1; resize: vertical; min-height: 48px; font-family: inherit; padding: 8px; }
  button { padding: 8px 16px; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
</style>
</head>
<body>
  <h1>🤖 NVIDIA AI Chat</h1>
  <div id="chat"></div>
  <form id="form">
    <textarea id="question" placeholder="Deine Frage..." required></textarea>
    <button id="send" type="submit">Senden</button>
  </form>

<script>
const chatEl = document.getElementById('chat');
const form = document.getElementById('form');
const questionEl = document.getElementById('question');
const sendBtn = document.getElementById('send');
let history = [];

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const question = questionEl.value.trim();
  if (!question) return;

  addMessage('user', question);
  history.push({ role: 'user', content: question });
  questionEl.value = '';
  sendBtn.disabled = true;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, history: history.slice(0, -1) })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Unbekannter Fehler');
    addMessage('assistant', data.answer);
    history.push({ role: 'assistant', content: data.answer });
  } catch (err) {
    addMessage('error', 'Fehler: ' + err.message);
  } finally {
    sendBtn.disabled = false;
  }
});
</script>
</body>
</html>
